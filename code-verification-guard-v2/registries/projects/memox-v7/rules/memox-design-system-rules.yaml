# MemoX V7 guard rules — domain: design_system
#
# The design system's component boundary: a feature composes shared primitives
# (`Mx*`), it does not rebuild them from raw Material widgets. The prose half of
# this contract has lived on the primitives themselves all along —
# `mx_action_button.dart` opens with "that is the whole point of having this
# widget instead of using `FilledButton` directly" — but prose on a shared
# widget is read by the person editing the shared widget, not by the person
# writing a new dialog in a feature. The 2026-08 theme-composition review found
# exactly that gap: the invariant was declared and nothing enforced it.
#
# History note: the old `memox` ruleset had this rule
# (`memox.design_system.no_raw_button`), and it was not carried into v7 when
# the ruleset was rebuilt for the feature-first tree — the nine rebuilt files
# simply did not include the design-system one. Loading the old file instead of
# writing this one would be worse than the gap: its scopes name the layer-first
# paths (`lib/presentation/features/**`), so it would pass green while matching
# nothing.
#
# Scope note: `presentation_files` (features/*/presentation only), NOT
# `ui_surfaces` — `lib/shared/` is where the primitives legitimately build the
# raw widgets these rules ban. Linting it would flag the definition as the
# crime, the same argument `memox-design-token-rules.yaml` makes for
# `lib/core/theme/`.
version: 1
metadata:
  id: memox-v7-design-system
  name: MemoX V7 Design System Rules
  description: >-
    Features compose shared Mx primitives; raw Material control widgets stay in
    lib/shared where the primitives are defined.
  owner: memox-v7
rules:
  - id: memox_v7.design_system.no_raw_button
    type: regex
    severity: error
    enabled: true
    message: >-
      No raw Material buttons in feature code. Use `MxActionButton` (variants:
      primary / secondary / destructive / tonal; sizes: standard / compact) or
      the other shared button primitives, so every action in the app resolves
      through one style pipeline. A shape the shared widget cannot express is a
      gap in the widget — extend it in lib/shared, do not route around it here.
    scopes:
      - presentation_files
    # `\b` is what keeps `MxTextButton` legal without a lookbehind: `x` and `T`
    # are both word characters, so there is no boundary inside the name.
    patterns:
      - '\bElevatedButton(?:\.[A-Za-z_][A-Za-z0-9_]*)?\s*\('
      - '\bFilledButton(?:\.[A-Za-z_][A-Za-z0-9_]*)?\s*\('
      - '\bOutlinedButton(?:\.[A-Za-z_][A-Za-z0-9_]*)?\s*\('
      - '\bTextButton(?:\.[A-Za-z_][A-Za-z0-9_]*)?\s*\('
    tags:
      - memox-v7
      - design-system

  # Every pattern below is line-anchored with the comment exemption the
  # duration rule established: prose that *names* a banned widget must not trip
  # the rule that bans it — the first dry run here flagged a doc comment that
  # said "used to be a raw IconButton(color:)" while explaining why it no
  # longer is.
  - id: memox_v7.design_system.no_raw_widget
    type: regex
    severity: error
    enabled: true
    message: >-
      No raw Material component widgets in feature code. Use the Mx shared
      primitive (MxCard, MxListTile, MxIconButton, MxFab, MxRadio, dialogs via
      the shared show helpers, ...) so the component's visual grammar has one
      owner. A widget with no Mx wrapper yet goes through the admission rule in
      the flutter-theme-design skill first — wrapper, tests, then guard —
      never raw-first.
    scopes:
      - presentation_files
    patterns:
      - '^(?!\s*(?://|\*)).*\b(?:Card|ListTile|IconButton|FloatingActionButton|InkResponse|ExpansionTile|Badge)\s*\('
      - '^(?!\s*(?://|\*)).*\b(?:Checkbox|Radio|TextFormField|Slider|RangeSlider|SegmentedButton|ToggleButtons)\s*[<(]'
      - '^(?!\s*(?://|\*)).*\b(?:NavigationBar|NavigationDrawer|NavigationRail|BottomNavigationBar|BottomAppBar|TabBar)\s*\('
      - '^(?!\s*(?://|\*)).*\b(?:Dialog|AlertDialog|SimpleDialog|MaterialBanner|SearchBar|SearchAnchor|DropdownMenu)\s*[<(]'
      - '^(?!\s*(?://|\*)).*\bshowDialog\s*[<(]'
      - '^(?!\s*(?://|\*)).*\b(?:SnackBar|SnackBarAction|InkWell)\s*\('
      - '^(?!\s*(?://|\*)).*\.showSnackBar\s*\('
      - '^(?!\s*(?://|\*)).*\b(?:Switch|SwitchListTile|CheckboxListTile|RadioListTile|RadioGroup)\s*[<(]'
      - '^(?!\s*(?://|\*)).*\b(?:PopupMenuButton|PopupMenuItem|DropdownButton|DropdownButtonHideUnderline)\s*[<(]'
    tags:
      - memox-v7
      - design-system

  - id: memox_v7.design_system.no_raw_style_escape
    type: regex
    severity: error
    enabled: true
    message: >-
      No hand-built styles in feature code. `ButtonStyle`, `styleFrom`,
      `BorderSide`, `BoxShadow`, `ShapeDecoration`, `RoundedRectangleBorder`,
      `WidgetStateProperty` and literal icon sizes are the design system's
      vocabulary — a feature that needs one is describing a variant the shared
      widget should own. Extend the Mx widget or the theme in lib/shared /
      lib/core/theme, then select it semantically here.
    scopes:
      - presentation_files
    patterns:
      - '^(?!\s*(?://|\*)).*\b(?:ButtonStyle|BorderSide|BoxShadow|ShapeDecoration|RoundedRectangleBorder)\s*\('
      - '^(?!\s*(?://|\*)).*\.styleFrom\s*\('
      - '^(?!\s*(?://|\*)).*\b(?:WidgetStateProperty|MaterialStateProperty)\b'
      - '^(?!\s*(?://|\*)).*\bIcon\s*\([^)]*\bsize\s*:\s*\d'
    tags:
      - memox-v7
      - design-system

  # Both app faces are variable fonts with a `wght` axis, and renderers read
  # the axis over `TextStyle.fontWeight` once it is present — so a bare
  # `copyWith(fontWeight:)` reports the new weight to every test and paints the
  # rung's old one on the device. Found live three separate times (the
  # NavigationBar's selected label, both migrated buttons' inline labels, and
  # then eleven more sites in one sweep); `AppTypography.withWeight` moves the
  # axis with the weight and is the only legal spelling.
  #
  # The pattern requires the `FontWeight.` literal on purpose:
  # `withWeight`'s own implementation writes `fontWeight: weight`, so the one
  # file allowed to touch the field never matches.
  - id: memox_v7.design_system.no_flat_style_from
    type: regex
    severity: error
    enabled: true
    message: >-
      No `styleFrom(` in widgets — feature or shared. `styleFrom` builds flat
      WidgetStatePropertyAll values that shadow the theme's resolvers for
      every state at once: the destructive button that never darkened, and the
      filled icon button whose disabled state stayed fully armed, were both
      this call. State pairs come from app_button_themes' builders
      (buildFilledStyle, textLinkForeground) or a ButtonStyle with explicit
      resolveWith. The one legitimate styleFrom lives in app_theme.dart, where
      it IS the theme being defined.
    scopes:
      - widget_ui_files
    patterns:
      - '^(?!\s*(?://|\*)).*\.styleFrom\s*\('
    tags:
      - memox-v7
      - design-system

  - id: memox_v7.design_system.no_bare_font_weight
    type: regex
    severity: error
    enabled: true
    message: >-
      Never set `fontWeight:` directly — on a variable font it reports one
      weight and paints another. Re-weight through
      `AppTypography.withWeight(style, FontWeight.wXXX)`, which moves the
      `wght` axis with it.
    scopes:
      - ui_and_theme_surfaces
    patterns:
      - '^(?!\s*(?://|\*)).*\bfontWeight\s*:\s*FontWeight\.'
    tags:
      - memox-v7
      - design-system
      - typography

  # A feature picks a rung and an AppInk; it does not mix styles. The first
  # pattern is the direct spelling; the second closes the laundering route the
  # M99.65 migration itself used to write — withWeight(...).copyWith(color:)
  # smuggles an open colour past a rule that only watches texts.*.copyWith.
  - id: memox_v7.design_system.no_text_restyle
    type: regex
    severity: error
    enabled: true
    message: >-
      No per-site text styling in feature code. Pick a rung and apply a closed
      ink: `texts.bodySmall!.inked(context, AppInk.quiet, isEmphasized:,
      isTabular:)`, or a named role on `context.textStyles`. A combination
      neither can express is a missing role — add it to AppTextStyles/AppInk in
      lib/core/theme, do not assemble it here.
    scopes:
      - presentation_files
    patterns:
      - '^(?!\s*(?://|\*)).*\btexts\.[a-zA-Z]+[!?]?\s*\.copyWith\s*\('
      - '^(?!\s*(?://|\*)).*withWeight\s*\([^)]*\)\s*\.copyWith\s*\('
      - '^(?!\s*(?://|\*)).*\btextTheme\.[a-zA-Z]+[!?]?\s*\.copyWith\s*\('
    tags:
      - memox-v7
      - design-system
      - typography

  # `.resolve(` is the one legal colour spelling on a raw Icon — it proves the
  # value came out of AppInk's closed set. Everything else is an open colour on
  # a glyph, which MxIcon exists to own.
  - id: memox_v7.design_system.no_raw_icon_color
    type: regex
    severity: error
    enabled: true
    message: >-
      No open `Icon(color:)` in feature code. Use `MxIcon(icon, ink: AppInk.x,
      size: MxIconSize.y)`; when the size genuinely has no MxIconSize step,
      keep `Icon` and spell the colour as `<AppInk>.resolve(context)` so it
      still comes from the closed set.
    scopes:
      - presentation_files
    patterns:
      - '^(?!\s*(?://|\*)).*\bIcon\s*\([^)]*\bcolor\s*:\s*(?![A-Za-z_][\w.]*\.resolve\()'
    tags:
      - memox-v7
      - design-system

  # `ColorScheme` takes the 45 Material 3 roles and nothing else (M100.17).
  # The constructor also accepts three deprecated roles — `background`,
  # `onBackground`, `surfaceVariant` — and `surfaceTint`, a tint mechanism the
  # SDK defaults to `primary` and every themed component switches off with
  # `surfaceTintColor: transparent`. Passing any of them either restates a
  # value the SDK already resolves or, worse, opens a slot where a second
  # decision can drift away from the role it shadows. Two patterns: the
  # two-space anchor is the argument line of a top-level `const ColorScheme(`
  # (or a top-level `copyWith(`) as `dart format` lays it out; the inline one
  # catches a single-line call. `background` is only in the anchored pattern
  # because the theme's own private builder takes a `background:` argument
  # mid-line, and that one is the page ground, not a scheme role.
  - id: memox_v7.design_system.color_scheme_45_roles_only
    type: regex
    severity: error
    enabled: true
    message: >-
      `ColorScheme` is built from the 45 Material 3 roles only. `background`,
      `onBackground` and `surfaceVariant` are deprecated, and `surfaceTint` is
      a mechanism the SDK already resolves to `primary` — do not pass any of
      them; the SDK fallback is the value, and a slot nobody reads is a slot
      that drifts. See the scheme header in `app_theme.dart` (M100.17).
    scopes:
      - theme_files
    patterns:
      - '^\s{2}(?:surfaceTint|background|onBackground|surfaceVariant)\s*:'
      - '\b(?:ColorScheme|copyWith)\([^)]*\b(?:surfaceTint|onBackground|surfaceVariant)\s*:'
    tags:
      - memox-v7
      - design-system

  # The read side of the rule above, for the whole of `lib/`: a widget that
  # reads `scheme.surfaceVariant` renders the SDK fallback (`surface`) and
  # calls it a role, and one that reads `scheme.surfaceTint` reads a value the
  # app switches off everywhere. `background` is deliberately absent — feature
  # code owns unrelated fields of that name — and `surfaceTintColor` stays
  # legal because `\b` after `surfaceTint` rejects it.
  - id: memox_v7.design_system.no_retired_color_role_read
    type: regex
    severity: error
    enabled: true
    message: >-
      Do not read `surfaceTint`, `onBackground` or `surfaceVariant` from a
      `ColorScheme`: the first is a tint mechanism the app disables on every
      component, the other two are deprecated and resolve to the SDK's
      fallback. Read the role you mean — `primary`, `onSurface`,
      `surfaceContainerHighest` (M100.17).
    scopes:
      - dart_lib
    patterns:
      - '\.\s*(?:surfaceTint|onBackground|surfaceVariant)\b'
    tags:
      - memox-v7
      - design-system
