# Project-side selector for code-verification-guard.
#
# This is the project's MAIN guard. It owns every check that `flutter analyze`
# cannot express — layer boundaries, Riverpod usage, design tokens, memox data
# invariants — including the rules riverpod_lint used to provide before it was
# descoped (see "Deferred and descoped" in docs/wbs.md).
#
# Run it:
#   python code-verification-guard-v2/guard/run.py check --project . --ruleset memox-v7
#
# ---------------------------------------------------------------------------
# About the vendored copy in code-verification-guard-v2/
# ---------------------------------------------------------------------------
# The guard is VENDORED INTO and OWNED BY this repository. The copy under
# code-verification-guard-v2/ is the single source of truth — engine, common
# rules, and the memox-v7 ruleset alike. It is committed here so a fresh clone
# runs the project's main gate with no second checkout; CI and dod_check.sh both
# depend on that. Its vendored version is recorded in
# code-verification-guard-v2/VERSION.
#
# Editing it is expected. Change the rules or the engine in place, run its tests
# from that directory (`python -m pytest -q`), and commit the change together
# with the MemoX change that motivated it — the same as any other file here.
#
# Do NOT re-clone an external guard remote over this directory. A refresh from a
# separate repository silently discards fixes that live only in this copy — the
# `common.no_commented_out_code` false-positive fix and the `DateTime.now()`-in-
# comment fix among them — which is the two-source-of-truth trap the earlier
# "refresh from upstream" note created. Those fixes are pinned by
# code-verification-guard-v2/tests/test_memox_false_positive_regressions.py so a
# careless re-vendor fails the guard's own suite. See that directory's AGENTS.md
# for the full ownership statement.
#
# The memox-v7 ruleset lives in
# code-verification-guard-v2/registries/projects/memox-v7/.
version: 1

project:
  name: memox-v7
  root: .
  source_roots:
    - lib

profile: local

rule_sets:
  common: true
  languages:
    - dart
    - flutter
  projects:
    - memox-v7

scopes: []
registries: []

overrides:
  disabled_rules: []
  severity: {}
  rule_options: {}

# Warnings are failures. Every rule carries real targets as of M3.1 — see the
# comment in the ruleset's config/profiles.yaml for what the softer gate was
# for, and what it caught on the way out.
failure:
  fail_on:
    - error
    - warning
  warning_as_error: true

report:
  format: console
  show_code_line: true
  show_fix_hint: true
