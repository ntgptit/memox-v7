# Copy to the project root as analysis_options.yaml.
#
# Two things to know before editing:
#   1. `flutter analyze` does NOT run riverpod_lint. The custom_lint plugin
#      below registers it, but it only executes via `dart run custom_lint`.
#      Both must be in CI or the Riverpod rules silently never run.
#   2. Rules promoted to `error` under `errors:` are what "analyzer clean"
#      means here. Demoting one is a project decision, not a local fix.

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true       # no implicit downcast from dynamic
    strict-inference: true   # no silently-inferred dynamic
    strict-raw-types: true   # no bare List / Map / Future

  errors:
    # Correctness — these are bugs, not style.
    invalid_annotation_target: ignore   # noisy false positives with freezed + json
    missing_required_param: error
    missing_return: error
    body_might_complete_normally: error

    # Async mistakes. Unawaited futures are the top source of "it worked
    # locally" race conditions, and of errors that vanish without a trace.
    unawaited_futures: error
    discarded_futures: error
    avoid_void_async: error
    unnecessary_await_in_return: warning

    # Error handling. A swallowed exception is a defect that reports as
    # "nothing happened", which is the hardest kind to diagnose.
    empty_catches: error
    avoid_catches_without_on_clauses: warning
    only_throw_errors: error

    # Style rules the project treats as binding.
    prefer_const_constructors: error
    prefer_const_declarations: error
    prefer_const_literals_to_create_immutables: error
    prefer_final_locals: error
    prefer_final_fields: error
    avoid_print: error
    avoid_dynamic_calls: error

    # Deliberately relaxed.
    lines_longer_than_80_chars: ignore
    public_member_api_docs: ignore

  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.mocks.dart"
    - "**/generated_plugin_registrant.dart"
    - "lib/l10n/generated/**"
    - "build/**"

  plugins:
    - custom_lint

linter:
  rules:
    # Immutability — state that can be mutated in place breaks Riverpod's
    # change detection in ways that look like "the UI didn't update".
    - prefer_final_in_for_each
    - avoid_setters_without_getters
    - immutable_classes

    # Control flow, matching the guard-clause style.
    - always_declare_return_types
    - avoid_bool_literals_in_conditional_expressions
    - curly_braces_in_flow_control_structures
    - no_leading_underscores_for_local_identifiers
    - prefer_null_aware_operators
    - unnecessary_null_checks
    - use_if_null_to_convert_nulls_to_bools

    # Exhaustiveness. Both matter for sealed-class state: without them a new
    # variant compiles fine and is silently unhandled at runtime.
    - exhaustive_cases
    - avoid_slow_async_io

    # Widgets and performance.
    - use_key_in_widget_constructors
    - sized_box_for_whitespace
    - use_colored_box
    - use_decorated_box
    - avoid_unnecessary_containers
    - prefer_const_constructors_in_immutables

    # Naming and structure.
    - camel_case_types
    - file_names
    - library_prefixes
    - non_constant_identifier_names
    - constant_identifier_names

    # Hygiene.
    - avoid_redundant_argument_values
    - cancel_subscriptions
    - close_sinks
    - test_types_in_equals
    - throw_in_finally
    - unnecessary_statements
    - use_build_context_synchronously   # the context-after-await trap
