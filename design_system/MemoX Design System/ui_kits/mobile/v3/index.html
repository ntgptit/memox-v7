<style>
  /* ── Documentation chrome palette ────────────────────────────────────
     The gallery shell (stage, phone bezel, controls, token tables, widget
     card frames) is NOT the product. It had accumulated 27 near-duplicate
     hexes — an accidental third palette next to Tokyo Pure / Tokyo Nebula.
     These 8 roles replace them. They are deliberately NOT --memox-* : nothing
     here ships, and mapping doc chrome onto the production ColorScheme would
     make the kit look like it has colors it does not. */
  :root {
    --doc-ink:        #1b1f3a;  /* headings, strong labels */
    --doc-ink-2:      #5a5f72;  /* body, control labels */
    --doc-ink-3:      #7a7f92;  /* muted: row numbers, corner tags */
    --doc-accent:     #3346d6;  /* code / Dart symbol blue — syntax, not brand */
    --doc-surface:    #ffffff;  /* doc panels, token cards, spec tables */
    --doc-control:    #ffffff;  /* active segment, stepper button */
    --doc-on-control: #191c1e;
    --doc-stage:      #e6e8ea;  /* page behind the phone frames */
    --doc-bezel:      #1a1a1a;  /* phone bezel */
  }
  body.stage-dark {
    --doc-ink:        #E4E8FA;
    --doc-ink-2:      #b8bdd2;
    --doc-ink-3:      #8b91a8;
    --doc-accent:     #b5c0ff;
    --doc-surface:    #131A3A;
    --doc-control:    #35353a;
    --doc-on-control: #e5e5e7;
    --doc-stage:      #0d0d0f;
    --doc-bezel:      #2a2a2c;
  }

  body { margin: 0; background: var(--doc-stage); font-family: var(--memox-font-sans); transition: background 200ms cubic-bezier(0.2,0,0,1); }
  body.stage-dark { background: var(--doc-stage); }
  .stage {
    padding: 28px;
    display: flex;
    gap: 28px;
    align-items: flex-start;
    justify-content: flex-start;
    overflow-x: auto;
    min-height: 100vh;
  }
  .phone {
    width: var(--phone-w, 390px);
    height: 780px;
    background: var(--memox-bg);
    border-radius: 44px;
    border: 8px solid var(--doc-bezel);
    overflow: hidden;
    position: relative;
    flex-shrink: 0;
    box-shadow: 0 24px 60px rgba(25,28,30,0.12);
  }

  }
  .phone-label {
    text-align: center;
    font-size: 11px;
    font-weight: 700;

    text-transform: uppercase;
    color: var(--memox-text-secondary);

  }
  .phone-col { display: flex; flex-direction: column; align-items: center; }
  /* ─────────────────────────────────────────────────────────────────────
     SHARED MOBILE LAYOUT SYSTEM  (Flutter mapping in mind — see LAYOUT.md)
     Every screen is a column: [ AppBar ] [ ScreenScroll (Expanded) ] [ BottomBar ].
     Pinned chrome (FAB, sheets, scrims, toasts) is the ONLY absolutely-
     positioned layer. All bottom clearance is derived from the tokens below —
     never hand-tuned per screen.
       .app           → Flutter  Scaffold + SafeArea
       .scroll        → Flutter  Expanded( SingleChildScrollView )
       .bottom-nav    → Flutter  Scaffold.bottomNavigationBar
       sticky footer  → Flutter  Scaffold.bottomNavigationBar / persistentFooterButtons
       .fab           → Flutter  Scaffold.floatingActionButton
     ───────────────────────────────────────────────────────────────────── */
  .app {
    height: 100%; width: 100%; display: flex; flex-direction: column;
    background: var(--memox-bg); color: var(--memox-text-primary);
    position: relative; overflow: hidden;
    /* ── Layout constants (the single source of truth for spacing/clearance) ── */
    --screen-gutter: 16px;                          /* one shared horizontal screen padding (matches app bars + footers) */
    --safe-bottom: env(safe-area-inset-bottom, 0px);/* device safe area → Flutter SafeArea  */
    --fab-h: 52px;                                  /* extended-FAB height                   */
    --fab-inset: var(--memox-space-xl);             /* FAB offset from the screen bottom (24)*/
    --fab-nav-gap: 4px;                             /* FAB lift above the bottom-nav block   */
    --clear-comfort: var(--memox-space-xl);         /* breathing room above any pinned UI(24)*/
    /* Composite bottom clearances — measured from the scroll container's own bottom edge.
       The bottom nav & sticky footers are in-flow siblings (they do NOT overlap scroll),
       so a scroll only ever needs to clear the FAB, which is the lone overlapping chrome. */
    --clear-base:    calc(var(--clear-comfort) + var(--safe-bottom));                           /* nav / footer / plain */
    --clear-fab:     calc(var(--fab-inset) + var(--fab-h) + var(--clear-comfort) + var(--safe-bottom)); /* FAB, no nav     */
    --clear-fab-nav: calc(var(--fab-nav-gap) + var(--fab-h) + var(--clear-comfort) + var(--safe-bottom)); /* FAB above nav */
  }
  /* Component contracts (.card .pill-btn .icon-btn .fab .appbar .bottom-nav .ov
     .icon-tile .status-dot + keyframes) now live in ../../components.css, linked
     above — they are the design system, not the preview harness. What stays here
     is frame-only: the phone bezel, the .app column, and scroll clearance. */
  /* v3: amber TEXT ink. --memox-warning is a fill/icon colour (~2:1 as 12px text on
     light surfaces); overdue counts use this ink instead — dark brown in Light, the
     amber itself on the Nebula navy. No global token changed. */
  :root { --memox-warning-ink: var(--memox-on-warning); }
  .memox-dark { --memox-warning-ink: var(--memox-warning); }
  /* ── v3 surface pass · card separation ──────────────────────────────────
     A card must read as a layer above the page in BOTH themes. Light relied on
     --memox-shadow-soft (4% alpha) alone against a #F7F9FE page: a ~2% luminance
     step, so cards dissolved into the background and grouping was carried by
     spacing only. The design system already does this job with the ghost edge —
     in dark, where the same problem exists. V3 promotes that one treatment to
     both themes: no new token, no heavier shadow, no new colour. Dark is
     unchanged (it already had the edge). Scoped to .app, so components.css —
     and therefore v1/v2 — stay exactly as they are. */
  .app .card { border: var(--memox-border-ghost); }
  .statusbar { height: 44px; display: flex; justify-content: space-between; align-items: center; padding: 0 24px; font-size: 14px; font-weight: 600; }
  /* ScreenScroll — the one scrollable region per screen. Horizontal gutter + bottom
     clearance both come from tokens; clearance variant set by a modifier class, never
     a per-screen pixel value. */
  .scroll { flex: 1; overflow-y: auto; padding: 0 var(--screen-gutter) var(--clear-base); scrollbar-width: none; -ms-overflow-style: none; }
  .scroll.scroll-fab     { padding-bottom: var(--clear-fab); }      /* screen has a FAB, no bottom nav */
  .scroll.scroll-fab-nav { padding-bottom: var(--clear-fab-nav); } /* screen has a FAB above the nav  */
  .scroll::-webkit-scrollbar { display: none; }
  /* Hit-target floor — 48dp (AppSpacing.minimumTouchTarget).
     Scoped to .pill-btn, the kit's one button contract: it owns a height
     (28–48px) and always sits in a footer, action row or card with room around
     it, so a centred 48px band cannot reach a neighbour. Bare inline text
     buttons are deliberately NOT expanded — a blanket rule gave them a 48px
     band that overhung into adjacent controls and stole their taps.
     .icon-btn brings its own expander; .fab is 52px and pinned. */
  .app .pill-btn:not(.fab) { position: relative; }
  .app .pill-btn:not(.fab)::after {
    content: ''; position: absolute; top: 50%; left: 50%;
    width: 100%; height: var(--memox-size-touch);
    min-width: var(--memox-size-touch);
    transform: translate(-50%, -50%);
  }
  /* Chip rows scroll horizontally with a 10px band between rows — narrower than
     the (48 − 28)/2 = 10px overhang. There the hit area is the painted chip and
     the 48dp floor is met by the row, not by growing each chip into the next. */
  .app .scroll-x .pill-btn::after { width: 100%; height: 100%; min-width: 0; }

  /* Scroll row — hide scrollbar but keep scrolling */
  .scroll-x { overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; }
  .scroll-x::-webkit-scrollbar { display: none; }
  /* Bottom-nav block — in-flow chrome (Flutter Scaffold.bottomNavigationBar).
     Bottom padding carries the device safe-area inset so the nav clears the home bar. */

  /* ── Dark mode (scoped, not via media query so users can toggle per preview) ── */
  /* Tokyo Nebula — deep navy night, paper indigo cards, violet accent */
  .memox-dark {
    --memox-surface:                    #0A0E27;
    --memox-surface-bright:             #232B5A;
    --memox-surface-dim:                #060925;
    --memox-surface-container-lowest:   #131A3A;
    --memox-surface-container-low:      #1B2249;
    --memox-surface-container:          #232B5A;
    --memox-surface-container-high:     #2C356E;
    --memox-surface-container-highest:  #353D7E;
    --memox-on-surface:          #E4E8FA;
    --memox-on-surface-variant:  #A4ACD0;
    --memox-outline:             #5A6BAE;
    --memox-outline-variant:     #2A3267;
    --memox-mastery: #6FE0BD;
    --memox-error:   #FF8FA3;
    /* Solid danger-button fill — deep rose, so dark-mode delete CTAs don't glare
       like the light-pink text/icon error color (#FF8FA3) did as a full fill */
    --memox-error-fill: #B0485C;
    --memox-on-error-fill: #FFFFFF;  /* unchanged — fill is dark in both modes */
    --memox-on-streak:     #FFFFFF;  /* unchanged — streak always warm, needs white text */
    --memox-streak:  #FFAE6E;
    --memox-chrome-glass: rgba(10, 14, 39, 0.84);
    --memox-border-ghost: 1px solid rgba(139, 154, 255, 0.16);
    --memox-primary:    #8B9AFF;              /* Phase 0: accessible dark primary (was #5265F5) */
    --memox-on-primary: #11173A;              /* deep navy content on the light-indigo fill */
    --memox-primary-bright: #8B9AFF;          /* alias — equal to --memox-primary now */
    --memox-primary-container:    #2D346A;
    --memox-on-primary-container: #D9DFFF;
    /* 5–8 Secondary */
    --memox-secondary:              #9DA8E8;
    --memox-on-secondary:           #1A2150;
    --memox-secondary-container:    #343C78;
    --memox-on-secondary-container: #DDE2FB;
    /* 9–12 Tertiary — signature violet */
    --memox-tertiary:              #B5A0FF;
    --memox-on-tertiary:           #240B63;
    --memox-tertiary-container:    #443078;
    --memox-on-tertiary-container: #E6DCFF;
    --memox-accent:    var(--memox-tertiary);
    --memox-on-accent: var(--memox-on-tertiary);
    /* 13–16 Error (--memox-error above) */
    --memox-on-error:           #52061B;
    --memox-error-container:    #7A2036;
    --memox-on-error-container: #FFD9DF;
    /* 22–24 Inverse — invariant across themes (fixed-dark toasts) */
    --memox-inverse-surface:     #34395D;
    --memox-on-inverse-surface:  #E8EAFC;
    --memox-inverse-primary:     #5265F5;
    /* 25–26 Effects */
    --memox-shadow: #000000;
    --memox-scrim:  #000000;
    /* 34–45 Fixed roles are intentionally NOT overridden in dark. */
    --memox-success:   #6FE0BD;
    --memox-warning:   #FFC658;
    --memox-mastery-fixed:    #1F4A37;
    --memox-on-mastery-fixed: #C7F2D8;
    /* Card status + rating — dark values (previously fell back to light tokens) */
    --memox-status-new:        #6B75A3;
    --memox-status-learning:   #FFC658;
    --memox-status-reviewing:  #8B9AFF;
    --memox-status-mastered:   #6FE0BD;
    --memox-rating-again:      #FF8FA3;
    --memox-rating-hard:       #FFC658;
    --memox-rating-good:       #8B9AFF;
    --memox-rating-easy:       #6FE0BD;
    --memox-self-missed:  #FF8FA3;
    --memox-self-partial: #FFC658;
    --memox-self-gotit:   #6FE0BD;
    --memox-mastery-low:  #8B4F66;
    --memox-mastery-mid:  #8B7338;
    --memox-mastery-high: #3F8070;
    /* ── Phase 0 — semantic role layer (dark, mirrors colors_and_type.css) ── */
    --memox-bg:              var(--memox-surface);
    --memox-surface-raised:  var(--memox-surface-container-lowest); /* paper indigo — aligned with colors_and_type.css dark */
    --memox-surface-muted:   var(--memox-surface-container-low);
    --memox-surface-hero:    color-mix(in srgb, var(--memox-primary) 12%, var(--memox-surface));
    --memox-chrome:          var(--memox-chrome-glass);
    --memox-border:          var(--memox-outline-variant);
    --memox-text-primary:    var(--memox-on-surface);
    --memox-text-secondary:  var(--memox-on-surface-variant);
    --memox-text-muted:      var(--memox-outline);
    --memox-primary-hover:   #A6B2FF;
    --memox-primary-soft:    color-mix(in srgb, var(--memox-primary) 20%, transparent);
    --memox-primary-border:  color-mix(in srgb, var(--memox-primary) 32%, transparent);
    --memox-danger:          var(--memox-error);
    --memox-on-danger:       #2A0A12;
    --memox-danger-soft:     color-mix(in srgb, var(--memox-error) 16%, transparent);
    --memox-danger-border:   color-mix(in srgb, var(--memox-error) 32%, transparent);
    --memox-on-success:      #06231A;
    --memox-success-soft:    color-mix(in srgb, var(--memox-success) 18%, transparent);
    --memox-success-border:  color-mix(in srgb, var(--memox-success) 32%, transparent);
    --memox-on-warning:      #2A1E00;
    --memox-warning-soft:    color-mix(in srgb, var(--memox-warning) 18%, transparent);
    --memox-warning-border:  color-mix(in srgb, var(--memox-warning) 32%, transparent);
    --memox-progress-track:  var(--memox-surface-container-high);
    --memox-badge-bg:        var(--memox-surface-container);
    --memox-shadow-none:     none;
    --memox-shadow-soft:     none;
    --memox-shadow-card:     0 16px 40px rgba(0,0,0,0.42);
    --memox-shadow-chrome:   0 -2px 14px rgba(0,0,0,0.36);
    --memox-shadow-fab:      0 10px 28px rgba(0,0,0,0.5);
  }

  /* ── Rewritten gallery shell: per-screen rows, light+dark pairs, state steppers ── */

    position: sticky; top: 0; z-index: 20;

  /* ── Narrow viewports (real phones / split panes) ───────────────────────
     The gallery is authored as a wide side-by-side wall; on a phone that
     means a clipped, unpannable page. Here it collapses to one column:
     frames fluid to the viewport, light+dark stacked, chrome compacted,
     and the width picker dropped (a frame can't exceed the screen). */
  @media (max-width: 760px) {
    body { -webkit-text-size-adjust: 100%; }
    .controls { gap: 8px 8px; padding: 8px 12px; }
    .brandblock { width: calc(100% - 40px); margin-right: 0; }
    .brand { font-size: 13px; }
    .sub { display: none; }
    .ctl { gap: 4px; }
    .ctl-width { display: none; }
    .seg-label { font-size: 9px; letter-spacing: 1px; }
    .seg button { height: 32px; min-width: 40px; padding: 0 12px; }
    .kitlink { height: 30px; margin-left: auto; font-size: 11px; padding: 0 12px; }
    .bar-toggle { position: absolute; top: 8px; right: 12px; margin-left: 0; order: 0; }
    .controls.collapsed .bar-toggle { position: static; }
    .gallery { padding: 4px 12px 72px; }
    .section-head { padding: 28px 2px 4px; font-size: 11px; }
    .row { padding: 8px 0; }
    .row-head { gap: 8px 8px; margin-bottom: 12px; }
    .row-title { font-size: 15px; }
    .stepper { width: 100%; justify-content: space-between; }
    .st-label { min-width: 0; flex: 1; }
    .pair { flex-direction: column; align-items: center; gap: 24px; }
    /* Frame keeps its authored 390×780 geometry and is scaled to fit the actual
       device viewport (S23 Ultra is taller/narrower than the 1:2 mock ratio).
       Negative margins reclaim the layout space the transform no longer uses. */
    .phone {
      width: var(--phone-w, 390px);
      border-width: 5px;
      border-radius: 36px;
      box-shadow: 0 12px 30px rgba(25,28,30,0.14);
      transform: scale(var(--phone-scale, 1));
      transform-origin: top center;
      margin-bottom: calc((1 - var(--phone-scale, 1)) * -796px);
      margin-left: calc((1 - var(--phone-scale, 1)) * -203px);
      margin-right: calc((1 - var(--phone-scale, 1)) * -203px);
    }
    .row-placeholder { height: calc(822px * var(--phone-scale, 1)); }

  /* ── A11y layer (added in audit pass) ───────────────────────────────
     Applies uniformly to every screen via shared primitives.
     Flutter mapping: focus ring → Material focus highlight;
     44px hit floor → IconButton's default 48dp tap target. */
  /* Visible keyboard focus on every interactive control */
  .app button:focus-visible,
  .icon-btn:focus-visible,
  .pill-btn:focus-visible,
  .bn-item:focus-visible,
  [role="switch"]:focus-visible,
  [role="button"]:focus-visible {
    outline: 2px solid var(--memox-primary);
    outline-offset: 2px;
  }
  .icon-btn::after {
    content: ''; position: absolute; top: 50%; left: 50%;
    width: var(--memox-size-touch); height: var(--memox-size-touch); transform: translate(-50%, -50%);
  }
  /* Bottom-nav items are real <button>s now — reset native chrome + give a tall tap area */
  .bn-item { background: none; border: none; width: 100%; padding: 8px 0; font-family: inherit; }
  /* Hidden-scrollbar utility for in-screen scrollers (matches .scroll behavior).
     overflow-x pinned to hidden: setting only overflow-y:auto makes overflow-x
     compute to auto too, which produced a stray horizontal scrollbar. */
  .hide-scroll { overflow-x: hidden; scrollbar-width: none; -ms-overflow-style: none; }
  .hide-scroll::-webkit-scrollbar { display: none; }
  /* Component keyframes (memoxBlink/ScrimIn/DialogIn/SheetIn/Spin/SkelPulse) live in components.css */
  /* Respect reduced-motion: quiet the infinite skeleton/pulse loops */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
      scroll-behavior: auto !important;
    }
  }

  /* ── Design-token reference panel (Foundations) ───────────────────────
     A full-width, Flutter-handoff documentation surface. Independent of the
     phone-frame width: always shows the LIGHT (Tokyo Pure) + DARK (Tokyo
     Nebula) value of every token side by side, plus its Dart token reference. */
  :root { --tok-mono: ui-monospace, "SF Mono", "JetBrains Mono", "Roboto Mono", Menlo, Consolas, monospace; }
  .tokens-doc { color: var(--doc-ink); }
  body.stage-dark .tokens-doc { color: var(--doc-ink); }
  .tok-intro {
    background: var(--doc-surface); border: 1px solid rgba(20,24,48,0.10); border-radius: 20px;
    padding: 24px 24px; margin-bottom: 8px;
    box-shadow: 0 1px 2px rgba(25,28,30,0.04);
  }
  body.stage-dark .tok-intro { background: var(--doc-surface); border-color: rgba(139,154,255,0.16); box-shadow: none; }
  .tok-intro h2 { font-size: 22px; font-weight: 800; letter-spacing: -0.4px; margin: 0 0 4px; }
  .tok-intro p { font-size: 13.5px; line-height: 1.55; color: var(--doc-ink-2); margin: 0; max-width: 760px; }
  body.stage-dark .tok-intro p { color: var(--doc-ink-3); }
  .tok-intro code { font-family: var(--tok-mono); font-size: 12px; background: color-mix(in srgb, var(--memox-primary) 10%, transparent); color: var(--doc-accent); /* doc-only code-syntax blue — not a theme token */ padding: 1px 4px; border-radius: 4px; }
  body.stage-dark .tok-intro code { background: rgba(139,154,255,0.16); color: var(--doc-accent); }
  .tok-legend { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 16px; font-size: 11.5px; color: var(--doc-ink-2); }
  body.stage-dark .tok-legend { color: var(--doc-ink-3); }
  .tok-legend b { color: var(--doc-ink); font-weight: 700; }
  body.stage-dark .tok-legend b { color: var(--doc-ink); }

  .tok-block { margin-top: 32px; }
  .tok-block-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .tok-block-head .n { font-size: 11px; font-weight: 800; letter-spacing: 1px; color: var(--doc-ink-3); font-family: var(--tok-mono); }
  .tok-block-head h3 { font-size: 16px; font-weight: 800; letter-spacing: -0.2px; margin: 0; }
  .tok-block-head .dart { font-size: 11.5px; font-weight: 600; font-family: var(--tok-mono); color: var(--doc-accent); /* doc-only code-syntax blue — not a theme token */ background: color-mix(in srgb, var(--memox-primary) 8%, transparent); padding: 2px 8px; border-radius: 4px; }
  body.stage-dark .tok-block-head .dart { color: var(--doc-accent); background: rgba(139,154,255,0.14); }
  .tok-block-head .note { font-size: 12px; color: var(--doc-ink-2); }
  body.stage-dark .tok-block-head .note { color: var(--doc-ink-3); }

  /* color swatch grid */
  .tok-cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(244px, 1fr)); gap: 12px; }
  .tok-color {
    background: var(--doc-surface); border: 1px solid rgba(20,24,48,0.09); border-radius: 16px; overflow: hidden;
  }
  body.stage-dark .tok-color { background: var(--doc-surface); border-color: rgba(139,154,255,0.14); }
  .tok-color .chips { display: flex; height: 64px; }
  .tok-color .chip { flex: 1; position: relative; }
  .tok-color .chip span { position: absolute; left: 8px; bottom: 6px; font-family: var(--tok-mono); font-size: 10px; font-weight: 600; padding: 1px 4px; border-radius: 4px; background: rgba(255,255,255,0.82); color: var(--doc-ink); }
  .tok-color .chip.is-dark span { background: rgba(10,14,39,0.7); color: var(--doc-ink); }
  .tok-color .meta { padding: 8px 12px 12px; }
  .tok-color .meta .role { font-size: 12.5px; font-weight: 700; }
  .tok-color .meta .dart { font-family: var(--tok-mono); font-size: 10.5px; color: var(--doc-ink-2); margin-top: 2px; word-break: break-all; }
  body.stage-dark .tok-color .meta .dart { color: var(--doc-ink-3); }
  .tok-corner-tags { display: flex; gap: 4px; padding: 0 12px 12px; }
  .tok-corner-tags em { font-style: normal; font-size: 9.5px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase; color: var(--doc-ink-3); background: rgba(20,24,48,0.05); padding: 2px 4px; border-radius: 4px; }
  body.stage-dark .tok-corner-tags em { color: var(--doc-ink-3); background: rgba(255,255,255,0.06); }

  /* spec table (type, spacing, radius, sizes, opacity, motion) */
  .tok-table { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--doc-surface); border: 1px solid rgba(20,24,48,0.09); border-radius: 16px; overflow: hidden; }
  body.stage-dark .tok-table { background: var(--doc-surface); border-color: rgba(139,154,255,0.14); }
  .tok-table th { text-align: left; font-size: 10px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: var(--doc-ink-3); padding: 12px 16px; border-bottom: 1px solid rgba(20,24,48,0.08); }
  body.stage-dark .tok-table th { color: var(--doc-ink-3); border-bottom-color: rgba(139,154,255,0.14); }
  .tok-table td { padding: 8px 16px; border-bottom: 1px solid rgba(20,24,48,0.05); vertical-align: middle; }
  body.stage-dark .tok-table td { border-bottom-color: rgba(139,154,255,0.08); }
  .tok-table tr:last-child td { border-bottom: none; }
  .tok-table .mono { font-family: var(--tok-mono); font-size: 12px; color: var(--doc-accent); /* doc-only code-syntax blue — not a theme token */ }
  body.stage-dark .tok-table .mono { color: var(--doc-accent); }
  .tok-table .val { font-family: var(--tok-mono); font-size: 12.5px; font-weight: 600; }
  .tok-table .muted { color: var(--doc-ink-2); }
  body.stage-dark .tok-table .muted { color: var(--doc-ink-3); }
  .tok-swrap { background: rgba(20,24,48,0.03); border-radius: 4px; display: inline-block; }
  body.stage-dark .tok-swrap { background: rgba(255,255,255,0.04); }
  .tok-bar { background: var(--memox-primary); border-radius: 4px; height: 12px; display: inline-block; vertical-align: middle; }
  .tok-radius-demo { border: 2px solid var(--memox-primary); background: color-mix(in srgb, var(--memox-primary) 8%, transparent); }
  body.stage-dark .tok-radius-demo { background: rgba(139,154,255,0.12); }

  /* ── Shared-widget library (Components) ──────────────────────────────────
     Every reusable widget the screens compose from, each shown as a LIGHT and
     a DARK specimen (real MemoX tokens, .memox-dark scope) plus its Flutter
     widget mapping + variant list. Handoff doc for the Flutter component layer. */
  .wid-doc { color: var(--doc-ink); }
  body.stage-dark .wid-doc { color: var(--doc-ink); }
  .wid-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 16px; align-items: start; }
  .wid-card { background: var(--doc-surface); border: 1px solid rgba(20,24,48,0.09); border-radius: 16px; overflow: hidden; }
  body.stage-dark .wid-card { background: var(--doc-surface); border-color: rgba(139,154,255,0.14); }
  .wid-card.span2 { grid-column: span 2; }
  .wid-head { padding: 12px 16px 12px; border-bottom: 1px solid rgba(20,24,48,0.07); }
  body.stage-dark .wid-head { border-bottom-color: rgba(139,154,255,0.12); }
  .wid-head .nm { font-size: 13.5px; font-weight: 800; letter-spacing: -0.2px; display: flex; align-items: center; gap: 8px; }
  .wid-head .fl { font-family: var(--tok-mono); font-size: 11px; font-weight: 600; color: var(--doc-accent); /* doc-only code-syntax blue — not a theme token */ margin-top: 4px; display: inline-block; }
  body.stage-dark .wid-head .fl { color: var(--doc-accent); }
  .wid-head .ds { font-size: 11.5px; color: var(--doc-ink-2); margin-top: 4px; line-height: 1.45; }
  body.stage-dark .wid-head .ds { color: var(--doc-ink-3); }
  /* dual-theme specimen stage — panes STACK vertically so each specimen gets
     the card's full width (side-by-side halved the width and broke the fonts) */
  .wid-stage { display: flex; flex-direction: column; }
  .wid-pane { padding: 20px 16px; min-height: 76px; display: flex; flex-direction: column; align-items: stretch; justify-content: center; gap: 8px; position: relative; }
  /* Fixed surface literals so the widget pane backdrop is immune to outer .memox-dark token
     overrides — the pane itself IS the scope boundary (light pane always light, dark always dark)
     so using var(--memox-bg) here would collapse when the pane sits inside .memox-dark. */

  .wid-pane.d { background: var(--memox-surface-fixed-dark); /* = --memox-surface dark  */ color: var(--memox-text-primary); }
  .wid-pane.l + .wid-pane.d { border-top: 1px solid rgba(139,154,255,0.16); }
  .wid-pane > .lab { position: absolute; top: 7px; right: 9px; font-family: var(--tok-mono); font-size: 8.5px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: rgba(20,24,48,0.30); }
  .wid-pane.d > .lab { color: rgba(228,232,250,0.34); }
  /* variant chips footer */
  .wid-foot { padding: 8px 16px 12px; display: flex; flex-wrap: wrap; gap: 4px; border-top: 1px solid rgba(20,24,48,0.06); }
  body.stage-dark .wid-foot { border-top-color: rgba(139,154,255,0.10); }
  .wid-foot .vt { font-size: 10.5px; font-weight: 600; font-family: var(--tok-mono); color: #4a5278; background: rgba(20,24,48,0.05); padding: 2px 8px; border-radius: 4px; }
  body.stage-dark .wid-foot .vt { color: #A4ACD0; background: rgba(255,255,255,0.06); }
  .wid-foot .vt b { color: var(--doc-accent); /* doc-only code-syntax blue — not a theme token */ font-weight: 700; }
  body.stage-dark .wid-foot .vt b { color: var(--doc-accent); }

<script type="text/babel">
/* ─────── App wrapper with multiple phones ─────── */
// Lazy-mounts its screen only while near the horizontal viewport. With 129 frames,
// mounting every React tree on load is what made the gallery heavy — this keeps just
// the handful of frames in (and near) view mounted, and tears the rest down so the DOM
// stays small while scrolling. The .phone box is a fixed 390×780, so the placeholder
// reserves identical space and the scroll position never jumps.
const noop = () => {};

// Robust lazy-mount: mount a row's frames once it scrolls within ~1.6 viewports.
// Uses getBoundingClientRect on scroll/resize + an interval fallback, so it works
// in every environment (the old IntersectionObserver gate never fired in some webviews).
function useNear(ref) {
  const [near, setNear] = React.useState(false);
  React.useEffect(() => {
    if (near) return;
    let raf = null, iv = null, done = false;
    const cleanup = () => {
      window.removeEventListener('scroll', onScroll, true);
      window.removeEventListener('resize', onScroll);
      if (iv) clearInterval(iv);
      if (raf) cancelAnimationFrame(raf);
    };
    const check = () => {
      const n = ref.current; if (!n || done) return;
      const r = n.getBoundingClientRect();
      const vh = window.innerHeight || 800;
      if (r.top < vh * 1.6 && r.bottom > -vh * 0.6) { done = true; setNear(true); cleanup(); }
    };
    const onScroll = () => { if (raf) return; raf = requestAnimationFrame(() => { raf = null; check(); }); };
    window.addEventListener('scroll', onScroll, true);
    window.addEventListener('resize', onScroll);
    iv = setInterval(check, 350);
    check();
    return cleanup;
  }, [near]);
  return near;
}

// One device frame in a chosen theme. Dark applies the scoped .memox-dark token block.
function Frame({ theme, children }) {
  const dark = theme === 'dark';
  return (
    <div className={'frame-wrap' + (dark ? ' memox-dark' : '')}>
      <div className="phone">{children}</div>
      <div className="theme-label">
        <span className="theme-dot" style={{ background: dark ? '#8B9AFF' : '#5265F5' }}></span>
        {dark ? 'Dark · Tokyo Nebula' : 'Light · Tokyo Pure'}
      </div>
    </div>);
}

// A screen shown as a light+dark pair with a state stepper. Both frames share one state index.
function ScreenRow({ group, view, num }) {
  const [i, setI] = React.useState(0);
  const ref = React.useRef(null);
  const near = useNear(ref);
  const total = group.states.length;
  const cur = group.states[i % total];
  const single = total <= 1;
  const make = () => {
    const props = group.prop ? { go: noop, [group.prop]: cur[0] } : { go: noop };
    // Key by the current state value so screens that take the state only as a
    // useState initializer (Recall, Fill) remount and re-init when the stepper
    // changes states — otherwise both states render identically. Single-state
    // screens keep a constant key, so their interactivity is preserved.
    return React.createElement(group.Comp, { key: 'st-' + String(cur[0]), ...props });
  };
  const showLight = view !== 'dark';
  const showDark = view !== 'light';
  return (
    <div className="row" ref={ref}>
      <div className="row-head">
        <span className="row-num">{num}</span>
        <span className="row-title">{group.title}</span>
        {!single &&
          <div className="stepper" role="group" aria-label={group.title + ' states'}>
            <button onClick={() => setI((i - 1 + total) % total)} aria-label="Previous state" title="Previous state">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <span className="st-label">{cur[1]} · {(i % total) + 1}/{total}</span>
            <button onClick={() => setI((i + 1) % total)} aria-label="Next state" title="Next state">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><path d="M9 18l6-6-6-6"/></svg>
            </button>
          </div>}
        {single && <span className="st-label st-single">Single state</span>}
      </div>
      {near ?
        <div className="pair">
          {showLight ? <Frame theme="light">{make()}</Frame> : null}
          {showDark ? <Frame theme="dark">{make()}</Frame> : null}
        </div> :
        <div className="row-placeholder"></div>}
    </div>);
}

// luminance check so the inline hex label stays legible on its own swatch
function isDarkHex(hex) {
  if (!hex || hex[0] !== '#') return false;
  const h = hex.length === 4
    ? hex.slice(1).split('').map((c) => parseInt(c + c, 16))
    : [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
  return (0.299 * h[0] + 0.587 * h[1] + 0.114 * h[2]) < 150;
}

// one color token = a card with a Light chip + Dark chip, role + Dart symbol
function ColorToken({ role, dart, light, dark, tags }) {
  const chip = (hex, isDark) => (
    <div className="chip" style={{ background: hex || (isDark ? '#0A0E27' : '#F7F9FE') }}>
      {hex
        ? <span className={isDarkHex(hex) ? 'is-dark' : ''}>{hex}</span>
        : <span className={isDark ? 'is-dark' : ''} style={{ opacity: 0.7 }}>inherits</span>}
    </div>);
  return (
    <div className="tok-color">
      <div className="chips">{chip(light, false)}{chip(dark, true)}</div>
      <div className="meta">
        <div className="role">{role}</div>
        <div className="dart">{dart}</div>
      </div>
      {tags && tags.length
        ? <div className="tok-corner-tags">{tags.map((t) => <em key={t}>{t}</em>)}</div>
        : null}
    </div>);
}

// One widget card: header (name + Flutter map + desc), a dual-theme specimen
// stage (light + dark panes sharing one render fn, STACKED so each is full
// width), and variant chips. Which panes show follows the toolbar View toggle
// (light / dark / both) via WidgetViewCtx — so a single theme reads big & clean.
const WidgetViewCtx = React.createContext('both');
function WidgetCard({ nm, fl, ds, render, variants, span2 }) {
  const view = React.useContext(WidgetViewCtx);
  const showL = view !== 'dark';
  const showD = view !== 'light';
  return (
    <div className={'wid-card' + (span2 ? ' span2' : '')}>
      <div className="wid-head">
        <div className="nm">{nm}</div>
        <span className="fl">{fl}</span>
        {ds ? <div className="ds">{ds}</div> : null}
      </div>
      <div className="wid-stage">
        {showL ? <div className="wid-pane l"><span className="lab">Light</span>{render()}</div> : null}
        {showD ? <div className="wid-pane d memox-dark"><span className="lab">Dark</span>{render()}</div> : null}
      </div>
      {variants && variants.length
        ? <div className="wid-foot">{variants.map((v, i) => <span className="vt" key={i}>{v}</span>)}</div>
        : null}
    </div>);
}

          render={() => <div style={{ alignSelf: 'stretch', height: 48, borderRadius: 12, background: 'var(--memox-surface-container-highest)', display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '0 16px', boxShadow: '0 4px 12px rgba(0,0,0,0.18)' }}>
            <span style={{ fontSize: 12.5, color: 'var(--memox-text-primary)' }}>Card deleted</span>
            <span style={{ fontSize: 12.5, fontWeight: 700, color: 'var(--memox-primary)' }}>Undo</span>
          </div>}
          variants={[VT('action', 'optional'), VT('auto-dismiss')]} />
        <WidgetCard nm="BottomSheet" fl="showModalBottomSheet" span2
          ds="Action / picker sheet — grabber, title, action rows. Scrim behind."
          render={() => <div style={{ alignSelf: 'stretch', borderRadius: '16px 16px 0 0', background: 'var(--memox-surface-container-low)', border: 'var(--memox-border-ghost)', padding: '8px 16px 16px' }}>
            <div style={{ width: 34, height: 4, borderRadius: 999, background: 'var(--memox-outline-variant)', margin: '0 auto 12px' }} />
            <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '8px 0', fontSize: 14, fontWeight: 600, color: 'var(--memox-text-primary)' }}><Ic name="edit-2" size={17} color="var(--memox-text-secondary)" />Rename</div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '8px 0', fontSize: 14, fontWeight: 600, color: 'var(--memox-error)' }}><Ic name="trash-2" size={17} color="var(--memox-error)" />Delete</div>
          </div>}
          variants={[VT('grabber'), VT('rows', 'action / select')]} />
        <WidgetCard nm="Dialog" fl="AlertDialog" span2
          ds="Confirm / destructive. Title, body, cancel + confirm. level3 elevation."
          render={() => <div style={{ alignSelf: 'stretch', borderRadius: 16, background: 'var(--memox-surface-container-low)', border: 'var(--memox-border-ghost)', padding: 16, boxShadow: 'var(--memox-shadow-card)' }}>
            <div style={{ fontSize: 14, fontWeight: 800, color: 'var(--memox-text-primary)' }}>Delete deck?</div>
            <div style={{ fontSize: 12, color: 'var(--memox-text-secondary)', margin: '4px 0 16px', lineHeight: 1.45 }}>240 cards will be permanently removed.</div>
            <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end' }}>
              <span style={{ fontSize: 12.5, fontWeight: 700, color: 'var(--memox-text-secondary)' }}>Cancel</span>
              <span style={{ fontSize: 12.5, fontWeight: 700, color: 'var(--memox-error)' }}>Delete</span>
            </div>
          </div>}
          variants={[VT('confirm / destructive'), VT('elev', 'level3')]} />
        <WidgetCard nm="EmptyState" fl="custom — Column" span2
          ds="Zero-data placeholder: glyph, headline, hint, optional CTA."
          render={() => <div style={{ alignSelf: 'stretch', textAlign: 'center', padding: '4px 0' }}>
            <div style={{ width: 52, height: 52, borderRadius: 16, margin: '0 auto 8px', background: 'color-mix(in srgb, var(--memox-primary) 10%, transparent)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}><Ic name="inbox" size={26} color="var(--memox-primary)" /></div>
            <div style={{ fontSize: 13.5, fontWeight: 700, color: 'var(--memox-text-primary)' }}>No cards yet</div>
            <div style={{ fontSize: 11.5, color: 'var(--memox-text-secondary)', marginTop: 4 }}>Add your first flashcard to begin.</div>
          </div>}
          variants={[VT('glyph + copy'), VT('CTA', 'optional')]} />
        <WidgetCard nm="Skeleton" fl="shimmer placeholder" span2
          ds="Loading state — neutral blocks at surfaceContainer, subtle pulse (reduced-motion safe)."
          render={() => <div style={{ alignSelf: 'stretch', display: 'flex', alignItems: 'center', gap: 12 }}>
            <div style={{ width: 44, height: 44, borderRadius: 12, background: 'var(--memox-surface-container-highest)' }} />
            <div style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: 8 }}>
              <div style={{ height: 11, width: '70%', borderRadius: 4, background: 'var(--memox-surface-container-highest)' }} />
              <div style={{ height: 11, width: '45%', borderRadius: 4, background: 'var(--memox-surface-container-high)' }} />
            </div>
          </div>}
          variants={[VT('pulse', 'reduced-motion safe')]} />
      </WidgetSection>
    </div>
    </WidgetViewCtx.Provider>);
}

function App() {
  // On a phone-sized viewport start on a single theme — a stacked light+dark
  // pair would otherwise be two full screen-heights of scrolling per row.
  const narrow = typeof window !== 'undefined' && window.matchMedia('(max-width: 760px)').matches;
  const [view, setView] = React.useState(narrow ? 'light' : 'both');
  const [barOpen, setBarOpen] = React.useState(!narrow);
  // Fit the fixed 390×780 frame to the real viewport on phones (both axes).
  const [fit, setFit] = React.useState(1);
  React.useEffect(() => {
    const measure = () => {
      if (!window.matchMedia('(max-width: 760px)').matches) return setFit(1);
      setFit(Math.min(1, (window.innerWidth - 28) / 406, (window.innerHeight - 96) / 812));
    };
    measure();
    window.addEventListener('resize', measure);
    return () => window.removeEventListener('resize', measure);
  }, []);
  const [width, setWidth] = React.useState(390);
  React.useEffect(() => { document.body.classList.toggle('stage-dark', view === 'dark'); }, [view]);
  const widths = [360, 375, 390, 412];
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  return (
    <>
      <div className={barOpen ? 'controls' : 'controls collapsed'}>
        <button className="bar-toggle" onClick={() => setBarOpen(!barOpen)} aria-expanded={barOpen} aria-label={barOpen ? 'Hide toolbar' : 'Show toolbar'} title={barOpen ? 'Hide toolbar' : 'Show toolbar'}>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round">
            <path d={barOpen ? 'M18 15l-6-6-6 6' : 'M6 9l6 6 6-6'} />
          </svg>
        </button>
        {barOpen ? <>
        <div className="brandblock">
          <span className="brand">MemoX · Mobile UI Kit v3</span>
          <span className="sub">26 screens · light + dark · cycle states with the steppers</span>
        </div>
        <a className="kitlink" href="../components.html">Components & foundations →</a>
        <div className="ctl">
          <span className="seg-label">View</span>
          <div className="seg">
            {['both','light','dark'].map((v) => <button key={v} className={view === v ? 'active' : ''} onClick={() => setView(v)}>{cap(v)}</button>)}
          </div>
        </div>
        <div className="ctl ctl-width">
          <span className="seg-label">Width</span>
          <div className="seg">
            {widths.map((w) => <button key={w} className={width === w ? 'active' : ''} onClick={() => setWidth(w)}>{w}</button>)}
          </div>
        </div>
        </> : null}
      </div>
      <div className="gallery" style={{ '--phone-w': width + 'px', '--phone-scale': fit }}>
        {GROUPS.map((g) => (
          <React.Fragment key={g.num}>
            {g.section ? <div className="section-head">{g.section}</div> : null}
            <ScreenRow group={g} view={view} num={g.num} />
          </React.Fragment>
        ))}
      </div>
    </>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
