<script type="text/babel">
const { LangProvider } = window;

/* Rows mount as they come near the viewport: a wall of 40 phone frames is too
   heavy to mount at once (the page stops responding). The gate listens to
   scroll/resize, an IntersectionObserver and a timer, because different
   webviews suspend different ones of those while the page is offscreen. */
function useNear(ref) {
  const [near, setNear] = React.useState(false);
  React.useEffect(() => {
    if (near) return;
    let raf = null, iv = null, io = null, done = false;
    const check = () => {
      const n = ref.current; if (!n || done) return;
      const r = n.getBoundingClientRect(), vh = window.innerHeight || 800;
      if (r.top < vh * 0.9 && r.bottom > -vh * 0.5) { done = true; setNear(true); cleanup(); }
    };
    const onScroll = () => { check(); };
    const cleanup = () => {
      window.removeEventListener('scroll', onScroll, true);
      window.removeEventListener('resize', onScroll);
      if (io) io.disconnect();
      if (iv) clearInterval(iv); if (raf) cancelAnimationFrame(raf);
    };
    window.addEventListener('scroll', onScroll, true);
    window.addEventListener('resize', onScroll);
    if (window.IntersectionObserver && ref.current) {
      io = new IntersectionObserver((e) => { if (e.some((x) => x.isIntersecting)) check(); }, { rootMargin: '30% 0px' });
      io.observe(ref.current);
    }
    iv = setInterval(check, 300); check();
    return cleanup;
  }, [near]);
  /* Anything that interacts with the row (its stepper) mounts it at once. */
  return [near, () => setNear(true)];
}

function Frame({ theme, lang, children }) {
  const dark = theme === 'dark';
  return (
    <div className={'frame-wrap' + (dark ? ' memox-dark' : '')}>
      <div className="phone"><LangProvider lang={lang}>{children}</LangProvider></div>
      <div className="theme-label">
        <span className="theme-dot" style={{ background: dark ? '#8B9AFF' : '#5265F5' }}></span>
        {dark ? 'Dark · Tokyo Nebula' : 'Light · Tokyo Pure'}
      </div>
    </div>);
}

function ScreenRow({ group, view, lang }) {
  const [i, setI] = React.useState(0);
  const ref = React.useRef(null);
  const [near, forceNear] = useNear(ref);
  const total = group.states.length;
  const cur = group.states[i % total];
  const single = total <= 1;
  const step = (d) => { forceNear(); setI((i + d + total) % total); };
  const make = () => React.createElement(group.Comp, { key: 'st-' + String(cur[0]) + lang, state: cur[0] });
  return (
    <div className="row" ref={ref} onPointerDown={forceNear} onFocus={forceNear}>
      <div className="row-head">
        <span className="row-num">{group.num}</span>
        <span className="row-title">{group.title}</span>
        {group.note ? <span className="row-note">{group.note}</span> : null}
        {!single ?
          <div className="stepper" role="group" aria-label={group.title + ' states'}>
            <button onClick={() => step(-1)} aria-label="Previous state">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <span className="st-label">{cur[1]} · {(i % total) + 1}/{total}</span>
            <button onClick={() => step(1)} aria-label="Next state">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round"><path d="M9 18l6-6-6-6"/></svg>
            </button>
          </div> :
          <span className="st-label st-single">Single state</span>}
      </div>
      {near ?
        <div className="pair">
          {view !== 'dark' ? <Frame theme="light" lang={lang}>{make()}</Frame> : null}
          {view !== 'light' ? <Frame theme="dark" lang={lang}>{make()}</Frame> : null}
        </div> :
        <div className="row-placeholder">Scroll here to load these frames</div>}    </div>);
}

    note: 'Each option saves alone · app options are not learning progress',
    states: [
      S('loaded', 'Loaded'), S('savingOne', 'Saving one option'), S('saved', 'Saved'),
      S('invalidLimit', 'Invalid limit'), S('saveFailed', 'Save failed'), S('resetConfirm', 'Reset options'),
      S('resetDone', 'Options reset'), S('loading', 'Loading')
    ] },
  { num: 'A23', title: 'Daily reminder', Comp: window.Reminder,
    note: 'Permission only after the user turns it on · never card content',
    states: [
      S('off', 'Off'), S('turningOn', 'Asking permission'), S('on', 'On · 20:00'), S('turnedOn', 'Turned on'),
      S('changingTime', 'Changing time'), S('permissionDenied', 'Permission denied'), S('scheduleFailed', 'Could not schedule'),
      S('offButMayShow', 'Off · one may still show'), S('unavailable', 'Unavailable here'), S('loading', 'Loading')
    ] }
];

function App() {
  const [view, setView] = React.useState('both');
  const [lang, setLang] = React.useState('en');
  const [stageDark, setStageDark] = React.useState(false);
  React.useEffect(() => { document.body.classList.toggle('stage-dark', stageDark); }, [stageDark]);
  React.useEffect(() => { if (window.lucide) window.lucide.createIcons(); });
  const seg = (val, set, opts) =>
    <div className="seg">{opts.map((o) =>
      <button key={o[0]} className={val === o[0] ? 'active' : ''} onClick={() => set(o[0])}>{o[1]}</button>)}</div>;
  return (
    <>
      <div className="controls">
        <div className="brandblock">
          <span className="brand">MemoX · Screens v2</span>
          <span className="sub">Rebuilt from the product-truth handoff. Functional constraints from PRODUCT_CONTEXT / FEATURE_SCREEN_REQUIREMENTS; visual language from the existing MemoX kit.</span>
        </div>
        <div className="ctl"><span className="seg-label">Theme</span>{seg(view, setView, [['light', 'Light'], ['dark', 'Dark'], ['both', 'Both']])}</div>
        <div className="ctl"><span className="seg-label">Copy</span>{seg(lang, setLang, [['en', 'EN'], ['vi', 'VI']])}</div>
        <div className="ctl"><span className="seg-label">Stage</span>{seg(stageDark ? 'd' : 'l', (v) => setStageDark(v === 'd'), [['l', 'Light'], ['d', 'Dark']])}</div>
      </div>
      <div className="gallery">
        {GROUPS.map((g) =>
          <React.Fragment key={g.num}>
            {g.section ? <div className="section-head">{g.section}</div> : null}
            <ScreenRow group={g} view={view} lang={lang} />
          </React.Fragment>)}
      </div>
    </>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
