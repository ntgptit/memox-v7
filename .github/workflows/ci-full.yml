name: CI (full)

# The heavy gates, run on demand rather than on every commit during the develop
# phase. Open the Actions tab, pick this workflow, and press "Run workflow" — do
# that before merging a milestone, and always before a release.
#
# What lives here (and why it is not on every PR):
#   * a from-cold rerun of the full test suite + its count floor — PR CI runs the
#     impact-selected non-golden subset (or all tests for high-risk changes),
#     while this job independently proves the global suite still runs
#     monolithically and has not silently shrunk;
#   * goldens + the golden count floor — linux-bound pixel comparisons;
#   * the web build (E2E channel) — a full dart2js compile;
#   * clean-rebuild reproducibility — a second, from-nothing build_runner pass.
#
# Still TODO for the release milestone, not wired here because they do not exist
# yet: Android release build, migration tests, E2E (Playwright), visual regression
# beyond goldens.
on:
  workflow_dispatch:

concurrency:
  group: ci-full-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  full-verify:
    name: full test suite + clean rebuild
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: code-verification-guard-v2/requirements.txt

      - name: install guard dependencies
        run: python -m pip install -r code-verification-guard-v2/requirements.txt

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:'

      # No build_runner cache in this job on purpose: its whole reason to exist
      # is the from-cold reproducibility check below, and restoring a warm graph
      # would undercut it. The other jobs (goldens, web) cache it; this one must
      # not.
      - name: pub get
        run: flutter pub get

      - name: generate
        run: dart run build_runner build --delete-conflicting-outputs

      # The absolute check: drop the build_runner cache and every generated file,
      # rebuild from source, and compare the file set and hashes. Slow, hence
      # milestone-only.
      - name: generated code clean rebuild is reproducible
        run: bash .claude/skills/flutter-workflow/scripts/check_generated.sh

      - name: document integrity (with invariant self-test)
        run: bash .claude/skills/flutter-workflow/scripts/check_docs.sh

      - name: precache and verify the SDK artifacts tests render with
        run: bash .claude/skills/flutter-workflow/scripts/prepare_test_fonts.sh

      - name: flutter test (full, excluding goldens)
        run: |
          set -o pipefail
          flutter test --exclude-tags golden --reporter expanded | tee test-output.txt

      # A suite that shrinks silently is coverage lost with everything still green.
      # The floor is a tripwire well below the current count, raised deliberately.
      - name: test count floor
        run: |
          count="$(grep -oE '\+[0-9]+' test-output.txt | tail -1 | tr -d '+')"
          echo "tests passed: ${count:-0}"
          if [ "${count:-0}" -lt 650 ]; then
            echo "::error::only ${count:-0} tests ran — the suite has shrunk. If that was intended, lower the floor in this workflow in the same commit."
            exit 1
          fi

  goldens:
    # Linux since M100.24, for the reason `dart_test.yaml` records: a golden has
    # one authoring platform and it is now this one. Kept in step with `ci.yml`
    # deliberately — two workflows comparing the same PNGs on two platforms is
    # how one of them becomes permanently red.
    name: goldens (linux) + count floor
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:'

      - name: cache build_runner
        uses: actions/cache@v4
        with:
          path: .dart_tool/build
          key: build-runner-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}-${{ github.sha }}
          restore-keys: |
            build-runner-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}-

      - name: pub get
        run: flutter pub get

      - name: generate
        run: dart run build_runner build --delete-conflicting-outputs

      # Required on Linux: the runner asks for lowercase material-font paths
      # while the SDK artifact ships mixed case, and without the symlinks every
      # glyph renders as `flutter_test`'s box.
      - name: prepare material fonts
        run: bash .claude/skills/flutter-workflow/scripts/prepare_test_fonts.sh

      # JSON reporter so the count floor below can read completion events; a real
      # golden failure still fails this step via pipefail.
      # TZ pinned for the same reason `ci.yml` pins it: `card_detail` renders
      # review timestamps through `toLocal()`, so the picture depends on the
      # machine's zone.
      - name: golden tests
        shell: bash
        env:
          TZ: UTC
        run: |
          set -o pipefail
          flutter test --tags golden --reporter json | tee golden-report.jsonl

      - name: golden count floor
        shell: bash
        run: python .claude/skills/flutter-workflow/scripts/count_golden_tests.py golden-report.jsonl 70

      - name: upload golden diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: |
            test/**/failures/**
          if-no-files-found: ignore
          retention-days: 7

  web-build:
    name: web build + Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:'

      - name: cache build_runner
        uses: actions/cache@v4
        with:
          path: .dart_tool/build
          key: build-runner-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}-${{ github.sha }}
          restore-keys: |
            build-runner-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}-

      - name: pub get
        run: flutter pub get

      - name: generate
        run: dart run build_runner build --delete-conflicting-outputs

      # `--no-web-resources-cdn`: without it Flutter fetches CanvasKit from gstatic
      # at runtime even though it is bundled, so a CDN-blocked environment renders
      # nothing with no build error.
      #
      # Two things this build is NOT the default one:
      #
      # * `-t lib/main_staging.dart` — the default entrypoint is the development
      #   config, which seeds the fixture decks at startup. The E2E flow begins
      #   at "cold start with an empty database", and a seeded one makes its
      #   first assertion meaningless.
      # * `--dart-define=MEMOX_E2E=true` — holds the semantics tree open, which
      #   is the only DOM Playwright can read from a canvas-rendered app. It is a
      #   compile-time constant, so no shipped build carries it.
      - name: build web
        run: flutter build web --release --no-web-resources-cdn -t lib/main_staging.dart --dart-define=MEMOX_E2E=true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: install e2e dependencies
        working-directory: e2e
        run: npm ci

      # Chromium rather than the machine's Chrome: the runner has no Chrome, and
      # this is the engine the app ships to.
      - name: install browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: e2e
        working-directory: e2e
        env:
          # Overrides `channel: 'chrome'` from the config, which is right on a
          # developer machine and wrong here.
          PLAYWRIGHT_BROWSER_CHANNEL: chromium
        run: npx playwright test

      - name: upload e2e report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

      # Always, unlike the report above. That one is a debugging aid and is only
      # interesting when something broke; this is the demo-flow evidence M4.12
      # requires — a numbered walk through the flow with the screen at each step
      # — and it is worth having precisely on the runs that passed. `always()`
      # rather than `success()` so a later step failing does not throw away
      # evidence the flow itself produced.
      - name: upload demo flow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-flow-evidence
          path: e2e/report/
          if-no-files-found: ignore
          retention-days: 30
