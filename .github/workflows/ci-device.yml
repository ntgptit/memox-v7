name: CI (device)

# The DEVICE-E2E suite: everything a host test cannot prove, and nothing else.
#
# **Not on pull requests, on purpose.** An Android emulator on a GitHub runner
# costs 30–45 minutes a run and is the flakiest thing in a pipeline. Paying that
# on every PR buys less than it costs, which is why business correctness was
# moved to `flutter test` in `ci.yml` — see
# `docs/it-scenarios/12-testing-pyramid-audit.md`. What is left here is the
# platform boundary: cold start, process death, deep links, the back gesture and
# a release smoke. Those genuinely cannot be shown on the host.
#
# It runs before a release, and on demand. A nightly schedule is available and
# commented out rather than removed: turning it on is a one-line decision, and a
# nightly that nobody reads is worse than no nightly.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  # schedule:
  #   - cron: '0 18 * * *'

concurrency:
  group: ci-device-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  device-e2e:
    name: DEVICE-E2E on Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: pub get
        run: flutter pub get

      # Generated code is not committed (see .gitignore); nothing analyses or
      # builds until it exists.
      - name: generate
        run: dart run build_runner build --delete-conflicting-outputs

      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The flavor is not optional: the app declares three and Gradle produces
      # no APK without one.
      #
      # Airplane mode is a **precondition** of IT-NAV-007 and IT-CONT-008, not a
      # step inside them: no widget can turn the radios off, so the run does it.
      # `|| true` on both ends because a device that refuses the command is a
      # weaker run, not a failed one — and the two scenarios then assert the
      # same things online, which is still true, just less interesting.
      - name: run the device suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb shell cmd connectivity airplane-mode enable || true
            flutter test integration_test/ --flavor development
            status=$?
            adb shell cmd connectivity airplane-mode disable || true
            exit $status

      - name: upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: device-e2e-logs
          path: |
            build/
            !build/**/*.apk
          retention-days: 7
