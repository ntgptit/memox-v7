name: CI

# Pull requests always expose one stable aggregate check (`CI gate`). A change
# receives an immutable verification plan built from feature, layer, contract
# impact and risk. The plan only grows: public contracts expand through declared
# downstream dependencies and reverse imports add transitive test consumers,
# while schema/shared/router/native/unknown paths fail safe to the complete code
# path. Golden-only files use runnable surrogates because Windows full CI owns
# pixels. The selected host suite is balanced across one, two or five file-level
# shards; UI work additionally runs Widgetbook.
#
# Goldens, clean codegen reproducibility and web build remain in ci-full.yml.
# The PR pipeline is intentionally not repeated on push to main: the required
# aggregate check has already verified the exact PR head, and rerunning it after
# merge consumed another ~6 minutes without adding coverage.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    name: classify change set
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      changed_count: ${{ steps.changes.outputs.changed_count }}
      has_prompt_changes: ${{ steps.changes.outputs.has_prompt_changes }}
      prompt_only: ${{ steps.changes.outputs.prompt_only }}
      docs_only: ${{ steps.changes.outputs.docs_only }}
      code_required: ${{ steps.changes.outputs.code_required }}
      needs_contracts: ${{ steps.changes.outputs.needs_contracts }}
      needs_static: ${{ steps.changes.outputs.needs_static }}
      needs_host_tests: ${{ steps.changes.outputs.needs_host_tests }}
      needs_widgetbook: ${{ steps.changes.outputs.needs_widgetbook }}
      needs_goldens: ${{ steps.changes.outputs.needs_goldens }}
      full_suite: ${{ steps.changes.outputs.full_suite }}
      risk: ${{ steps.changes.outputs.risk }}
      shard_count: ${{ steps.changes.outputs.shard_count }}
      shard_matrix: ${{ steps.changes.outputs.shard_matrix }}
      test_files_json: ${{ steps.changes.outputs.test_files_json }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: classify changed paths
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --name-only --diff-filter=ACMRTD -z "$BASE_SHA" "$HEAD_SHA" \
              | python .claude/skills/flutter-workflow/scripts/build_verification_plan.py \
                  --nul --github-output "$GITHUB_OUTPUT"
          else
            printf '' \
              | python .claude/skills/flutter-workflow/scripts/build_verification_plan.py \
                  --force-full --github-output "$GITHUB_OUTPUT"
          fi

  contracts:
    name: tooling · docs · prompt contracts
    needs: classify
    if: needs.classify.outputs.needs_contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: CI tooling unit tests
        run: python -m unittest discover -s .claude/skills/flutter-workflow/scripts/tests -p 'test_*.py'

      - name: document integrity
        run: python .claude/skills/flutter-workflow/scripts/check_docs.py --quiet

      - name: prompt delivery contract
        if: needs.classify.outputs.has_prompt_changes == 'true'
        run: python .claude/skills/flutter-workflow/scripts/check_prompt_contract.py

  static:
    name: format · analyze · guards · docs
    needs: classify
    if: needs.classify.outputs.needs_static == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: code-verification-guard-v2/requirements.txt

      - name: install guard dependencies
        run: python -m pip install -r code-verification-guard-v2/requirements.txt

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:'

      - name: cache build_runner
        uses: actions/cache@v4
        with:
          path: .dart_tool/build
          key: build-runner-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}-${{ github.sha }}-static
          restore-keys: |
            build-runner-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}-

      - name: pub get
        run: flutter pub get

      # Root analysis_options includes the Widgetbook package. A cold runner
      # needs its package config even though Widgetbook tests run separately.
      - name: pub get (widgetbook catalog for root analyze)
        run: flutter pub get
        working-directory: widgetbook

      - name: generate
        run: dart run build_runner build --delete-conflicting-outputs

      - name: generated code freshness
        run: bash .claude/skills/flutter-workflow/scripts/check_generated.sh --skip-rebuild

      - name: dart format
        run: bash .claude/skills/flutter-workflow/scripts/check_format.sh

      - name: flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: architecture boundaries
        run: bash .claude/skills/flutter-architecture/scripts/check_architecture.sh

      - name: guard version
        run: |
          echo "Guard registry version: $(cat code-verification-guard-v2/VERSION)"

      - name: code verification guard
        run: python code-verification-guard-v2/guard/run.py check --project . --ruleset memox-v7

  host_tests:
    name: host tests · shard ${{ matrix.label }}/${{ matrix.total }}
    needs: classify
    if: needs.classify.outputs.needs_host_tests == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.classify.outputs.shard_matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:'

      - name: cache build_runner
        uses: actions/cache@v4
        with:
          path: .dart_tool/build
          key: build-runner-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}-${{ github.sha }}-host-${{ matrix.shard }}
          restore-keys: |
            build-runner-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}-

      - name: pub get
        run: flutter pub get

      - name: generate
        run: dart run build_runner build --delete-conflicting-outputs

      - name: prepare material fonts
        run: bash .claude/skills/flutter-workflow/scripts/prepare_test_fonts.sh

      - name: host test suite (non-golden)
        env:
          TEST_FILES_JSON: ${{ needs.classify.outputs.test_files_json }}
        run: |
          mapfile -d '' test_files < <(
            python .claude/skills/flutter-workflow/scripts/select_test_shard.py \
              --total-shards ${{ matrix.total }} \
              --shard-index ${{ matrix.shard }} \
              --test-files-json "$TEST_FILES_JSON" \
              --nul
          )
          flutter test --exclude-tags golden --reporter failures-only "${test_files[@]}"

  widgetbook:
    name: Widgetbook smoke test
    needs: classify
    if: needs.classify.outputs.needs_widgetbook == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:'

      - name: cache build_runner
        uses: actions/cache@v4
        with:
          path: .dart_tool/build
          key: build-runner-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}-${{ github.sha }}-widgetbook
          restore-keys: |
            build-runner-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}-

      - name: pub get
        run: flutter pub get

      - name: pub get (widgetbook catalog)
        run: flutter pub get
        working-directory: widgetbook

      - name: generate
        run: dart run build_runner build --delete-conflicting-outputs

      - name: prepare material fonts
        run: bash .claude/skills/flutter-workflow/scripts/prepare_test_fonts.sh

      - name: widgetbook catalog smoke test
        run: flutter test --reporter failures-only
        working-directory: widgetbook

  goldens:
    # **Pixel comparison, on the PR, on Windows.**
    #
    # `ci-full.yml` has had this job since the start and it is
    # `workflow_dispatch:` — so nothing ever compared a committed PNG against a
    # fresh render unless a person remembered to. #337 changed how six
    # components lay out through `MxButtonPair`, committed no goldens, passed
    # every check here, and left 26 stale pictures on `main`; the screen
    # gallery went on publishing a pre-#337 app until the suite was run by
    # hand. Every other gate in this file reads source text or a widget tree,
    # and none of them can see a rectangle that moved.
    #
    # Windows because goldens are bound to it — `dart_test.yaml` pins the
    # platform, and a Linux render differs in font rasterisation. The runner
    # costs double, which is why the job is conditional rather than always-on.
    name: goldens (windows)
    needs: classify
    if: needs.classify.outputs.needs_goldens == 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:'

      - name: cache build_runner
        uses: actions/cache@v4
        with:
          path: .dart_tool/build
          key: build-runner-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}-${{ github.sha }}-goldens
          restore-keys: |
            build-runner-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}-

      - name: pub get
        run: flutter pub get

      - name: generate
        run: dart run build_runner build --delete-conflicting-outputs

      - name: golden comparison
        run: flutter test --tags golden --reporter failures-only

      # The failure images are the whole point of a red golden job: without
      # them the reviewer knows a pixel moved and not which one.
      - name: upload failure images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: |
            test/**/failures/**
          if-no-files-found: ignore
          retention-days: 7

  gate:
    name: CI gate
    if: always()
    needs: [classify, contracts, static, host_tests, widgetbook, goldens]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: require the selected path to pass
        run: |
          python .claude/skills/flutter-workflow/scripts/check_ci_gate.py \
            --classify-result '${{ needs.classify.result }}' \
            --contracts-result '${{ needs.contracts.result }}' \
            --static-result '${{ needs.static.result }}' \
            --host-result '${{ needs.host_tests.result }}' \
            --widgetbook-result '${{ needs.widgetbook.result }}'             --goldens-result '${{ needs.goldens.result }}' \
            --needs-contracts '${{ needs.classify.outputs.needs_contracts }}' \
            --needs-static '${{ needs.classify.outputs.needs_static }}' \
            --needs-host-tests '${{ needs.classify.outputs.needs_host_tests }}' \
            --needs-widgetbook '${{ needs.classify.outputs.needs_widgetbook }}'             --needs-goldens '${{ needs.classify.outputs.needs_goldens }}'
