name: CI

# Pull requests always expose one stable aggregate check (`CI gate`). A change
# made exclusively under docs/prompt/ takes the Python-only prompt-contract
# path. Every mixed, empty or unknown change set fails safe to the complete code
# path: static verification, the whole non-golden host suite split across three
# parallel shards, and the Widgetbook smoke test.
#
# Goldens, clean codegen reproducibility and web build remain in ci-full.yml.
# The PR pipeline is intentionally not repeated on push to main: the required
# aggregate check has already verified the exact PR head, and rerunning it after
# merge consumed another ~6 minutes without adding coverage.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    name: classify change set
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      changed_count: ${{ steps.changes.outputs.changed_count }}
      has_prompt_changes: ${{ steps.changes.outputs.has_prompt_changes }}
      prompt_only: ${{ steps.changes.outputs.prompt_only }}
      code_required: ${{ steps.changes.outputs.code_required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: classify changed paths
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --name-only --diff-filter=ACMRD -z "$BASE_SHA" "$HEAD_SHA" \
              | python .claude/skills/flutter-workflow/scripts/classify_ci_changes.py \
                  --nul --github-output "$GITHUB_OUTPUT"
          else
            printf '' \
              | python .claude/skills/flutter-workflow/scripts/classify_ci_changes.py \
                  --force-code --github-output "$GITHUB_OUTPUT"
          fi

  prompt_contract:
    name: prompt contract
    needs: classify
    if: needs.classify.outputs.has_prompt_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: CI tooling unit tests
        run: python -m unittest discover -s .claude/skills/flutter-workflow/scripts/tests -p 'test_*.py'

      - name: prompt delivery contract
        run: python .claude/skills/flutter-workflow/scripts/check_prompt_contract.py

  static:
    name: format · analyze · guards · docs
    needs: classify
    if: needs.classify.outputs.code_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: code-verification-guard-v2/requirements.txt

      - name: install guard dependencies
        run: python -m pip install -r code-verification-guard-v2/requirements.txt

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:'

      - name: cache build_runner
        uses: actions/cache@v4
        with:
          path: .dart_tool/build
          key: build-runner-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}-${{ github.sha }}-static
          restore-keys: |
            build-runner-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}-

      - name: pub get
        run: flutter pub get

      - name: pub get (widgetbook catalog)
        run: flutter pub get
        working-directory: widgetbook

      - name: generate
        run: dart run build_runner build --delete-conflicting-outputs

      - name: generated code freshness
        run: bash .claude/skills/flutter-workflow/scripts/check_generated.sh --skip-rebuild

      - name: dart format
        run: bash .claude/skills/flutter-workflow/scripts/check_format.sh

      - name: flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: architecture boundaries
        run: bash .claude/skills/flutter-architecture/scripts/check_architecture.sh

      - name: guard version
        run: |
          echo "Guard registry version: $(cat code-verification-guard-v2/VERSION)"

      - name: code verification guard
        run: python code-verification-guard-v2/guard/run.py check --project . --ruleset memox-v7

      - name: document integrity
        run: bash .claude/skills/flutter-workflow/scripts/check_docs.sh

      - name: CI tooling unit tests
        run: python -m unittest discover -s .claude/skills/flutter-workflow/scripts/tests -p 'test_*.py'

  host_tests:
    name: host tests · shard ${{ matrix.label }}/3
    needs: classify
    if: needs.classify.outputs.code_required == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 0
            label: 1
          - shard: 1
            label: 2
          - shard: 2
            label: 3
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:'

      - name: cache build_runner
        uses: actions/cache@v4
        with:
          path: .dart_tool/build
          key: build-runner-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}-${{ github.sha }}-host-${{ matrix.shard }}
          restore-keys: |
            build-runner-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}-

      - name: pub get
        run: flutter pub get

      - name: generate
        run: dart run build_runner build --delete-conflicting-outputs

      - name: prepare material fonts
        run: bash .claude/skills/flutter-workflow/scripts/prepare_test_fonts.sh

      - name: host test suite (non-golden)
        run: |
          mapfile -d '' test_files < <(
            python .claude/skills/flutter-workflow/scripts/select_test_shard.py \
              --total-shards 3 --shard-index ${{ matrix.shard }} --nul
          )
          flutter test --exclude-tags golden --reporter failures-only "${test_files[@]}"

  widgetbook:
    name: Widgetbook smoke test
    needs: classify
    if: needs.classify.outputs.code_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:'

      - name: cache build_runner
        uses: actions/cache@v4
        with:
          path: .dart_tool/build
          key: build-runner-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}-${{ github.sha }}-widgetbook
          restore-keys: |
            build-runner-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}-

      - name: pub get
        run: flutter pub get

      - name: pub get (widgetbook catalog)
        run: flutter pub get
        working-directory: widgetbook

      - name: generate
        run: dart run build_runner build --delete-conflicting-outputs

      - name: prepare material fonts
        run: bash .claude/skills/flutter-workflow/scripts/prepare_test_fonts.sh

      - name: widgetbook catalog smoke test
        run: flutter test --reporter failures-only
        working-directory: widgetbook

  gate:
    name: CI gate
    if: always()
    needs: [classify, prompt_contract, static, host_tests, widgetbook]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: require the selected path to pass
        run: |
          python .claude/skills/flutter-workflow/scripts/check_ci_gate.py \
            --classify-result '${{ needs.classify.result }}' \
            --prompt-result '${{ needs.prompt_contract.result }}' \
            --static-result '${{ needs.static.result }}' \
            --host-result '${{ needs.host_tests.result }}' \
            --widgetbook-result '${{ needs.widgetbook.result }}' \
            --has-prompt-changes '${{ needs.classify.outputs.has_prompt_changes }}' \
            --prompt-only '${{ needs.classify.outputs.prompt_only }}' \
            --code-required '${{ needs.classify.outputs.code_required }}'
