name: CI

# The lightweight gate that runs on every change, kept deliberately cheap for the
# develop phase. It catches the mistakes that would be copied out of Deck into the
# next feature — a controller reaching the wrong layer, duplicated validation, a
# guard that scans nothing, stale generated code — without paying for a full test
# matrix, goldens, or a web build on every commit.
#
# The heavy jobs (full test suite, goldens + count floor, web build, clean-rebuild
# reproducibility) live in `ci-full.yml` and run on demand — open Actions and press
# "Run workflow", or before merging a milestone. This split is a develop-phase
# choice, not a permanent one: the heavy gates are still one click away and must be
# run before a release.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # So the light gate can also be run against any branch without a PR.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: format · analyze · guards · deck tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Python for the verification guard and the doc-integrity checks.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: code-verification-guard-v2/requirements.txt

      - name: install guard dependencies
        run: python -m pip install -r code-verification-guard-v2/requirements.txt

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
          # One SDK + pub cache shared by every ubuntu job across both
          # workflows — they resolve the same lockfile, so four separate caches
          # (flutter-verify-, -full-, -web-) were three redundant downloads.
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:'

      # build_runner's own incremental cache. Without it every run regenerates
      # from cold — drift_dev + riverpod_generator + freezed from scratch, ~30s.
      # Keyed on the lockfile (which changes when a generator version does) plus
      # the sha, so the newest run restores the most recent graph and build_runner
      # rebuilds only what a source edit touched. The reproducibility gate in
      # ci-full still builds cold, so a subtly-stale incremental output cannot
      # pass unnoticed.
      - name: cache build_runner
        uses: actions/cache@v4
        with:
          path: .dart_tool/build
          key: build-runner-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}-${{ github.sha }}
          restore-keys: |
            build-runner-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}-

      - name: pub get
        run: flutter pub get

      # The Widgetbook catalog is a nested package (widgetbook/). The root
      # `flutter analyze` run creates an analysis context for it too, so its
      # dependencies must be resolved here or every import in the catalog
      # reports uri_does_not_exist — 100+ errors that have nothing to do with
      # the change under review.
      - name: pub get (widgetbook catalog)
        run: flutter pub get
        working-directory: widgetbook

      # Generated code is gitignored, so this is what makes a fresh clone equal to a
      # developer's tree; analyze and the tests below would report hundreds of
      # unrelated errors without it.
      - name: generate
        run: dart run build_runner build --delete-conflicting-outputs

      # Freshness only (`--skip-rebuild`): nothing generated is committed, every
      # declared part is present. The absolute clean-rebuild-reproducibility check
      # is slow and lives in ci-full.yml.
      - name: generated code freshness
        run: bash .claude/skills/flutter-workflow/scripts/check_generated.sh --skip-rebuild

      - name: dart format
        run: dart format --output=none --set-exit-if-changed .

      - name: flutter analyze
        run: flutter analyze --no-fatal-infos

      # Architecture guards — the cheap ones that stop a boundary or ownership
      # mistake from being copied out of Deck.
      - name: architecture boundaries
        run: bash .claude/skills/flutter-architecture/scripts/check_architecture.sh

      - name: guard version
        run: |
          echo "Guard registry version: $(cat code-verification-guard-v2/VERSION)"

      - name: code verification guard
        run: python code-verification-guard-v2/guard/run.py check --project . --ruleset memox-v7

      - name: document integrity
        run: bash .claude/skills/flutter-workflow/scripts/check_docs.sh

      # Widget tests below render with the material fonts; the SDK ships them under
      # a CamelCase name that `flutter_test` asks for in lowercase, and Linux is
      # case-sensitive. Symlink both spellings, then fail loudly if still unreachable.
      - name: precache and verify the SDK artifacts tests render with
        run: |
          flutter precache --force --universal
          FONTS="$FLUTTER_ROOT/bin/cache/artifacts/material_fonts"
          cd "$FONTS"
          for file in *; do
            lower="$(printf '%s' "$file" | tr '[:upper:]' '[:lower:]')"
            [ "$file" = "$lower" ] && continue
            [ -e "$lower" ] && continue
            ln -s "$file" "$lower"
          done
          cd - > /dev/null
          if [ ! -f "$FONTS/roboto-regular.ttf" ]; then
            echo "::error::material fonts unreachable after precache — the toolchain is incomplete, not the project"
            ls -la "$FONTS" || true
            exit 1
          fi
          echo "material fonts reachable at $FONTS/roboto-regular.ttf"

      # Targeted, not the full suite: the AST/provider convention guards in
      # test/app, and the Deck domain + data + controller/presentation tests — the
      # ones that protect the feature being used as a template. `--exclude-tags
      # golden` because goldens are windows-bound and run in ci-full.
      - name: provider/AST convention and Deck tests
        run: flutter test --exclude-tags golden test/app test/features/deck

      # One smoke test: every registered use-case must construct and the shell
      # must build. A catalog nobody runs in CI is a catalog that rots the
      # first week nobody opens it.
      - name: widgetbook catalog smoke test
        run: flutter test
        working-directory: widgetbook
