# Test tags, declared so `flutter test --tags` / `--exclude-tags` are checked rather
# than silently matching nothing. Without this file the runner printed
# "Tags were used that weren't specified in dart_test.yaml" on every run — a warning
# that a mistyped tag would hide inside.
tags:
  # Compares rendered pixels against a committed PNG.
  #
  # **Platform-bound, and that is not a project defect.** Text rasterisation differs
  # between Windows, Linux and macOS, so a golden generated on one platform fails on
  # another by 1–3% of pixels. A golden therefore has exactly one authoring platform,
  # and every renderer — CI and human alike — has to be that platform.
  #
  # **It is Linux since M100.24.** It was Windows, because that is where the project
  # was developed. It is Linux because that is where the goldens are now *written*:
  # cloud sessions do the regenerating, every other CI job is `ubuntu-latest`, and the
  # owner reviews through the screen gallery rather than by re-rendering locally. The
  # move cost nothing to verify — the committed PNGs were already Linux renders, so
  # the comparison stayed byte-exact rather than gaining a tolerance.
  #
  # The consequence, stated rather than discovered: a Windows checkout can no longer
  # run `--update-goldens` and have CI agree with it. Regenerate from Linux or WSL.
  golden:
  # A strict visual audit (MX-VIS-001). Always also `golden`.
  screen-audit:
  # Design-review previews: rendered for a human to look at, not asserted against.
  review:
