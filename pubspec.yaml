name: memox
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  # Pinned to the major the code is written against, from the versions actually
  # resolved in pubspec.lock. They were `any`, and `any` is not a small
  # imprecision here: the whole state layer is codegen against a version-specific
  # contract — the generated `$Notifier` base, `@Riverpod(retry:)`,
  # `Notifier.listenSelf`, and `noAutomaticRetry`, which exists only because
  # Riverpod 3 retries a failed provider ten times with backoff and reports
  # `AsyncLoading` for the ~13 seconds it spends doing so. A resolver free to pick
  # the next major would change runtime behaviour with no code change and no
  # review, on whichever machine hit a cold cache first.
  #
  # The majors differ on purpose: `riverpod_annotation` 4 is the annotation set
  # for `flutter_riverpod` 3. Keep the three below in step with each other and
  # with `riverpod_generator`.
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3
  go_router: ^17.3.0
  drift: 2.34.0
  # Direct because core/error/drift_error_mapper.dart reads SqliteException.
  # resultCode: the exception drift throws for a constraint violation carries the
  # kind numerically, and the three kinds need different Failures.
  sqlite3: ^3.5.0
  path_provider: ^2.1.6
  path: ^1.9.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  # Constraint left open on purpose: flutter_localizations pins intl to an
  # exact version, and pinning it here by hand is a recurring resolution
  # conflict. pubspec.lock is what makes the build reproducible.
  intl: any
  collection: ^1.19.1
  uuid: ^4.6.0
  flutter_localizations:
    sdk: flutter
  drift_flutter: ^0.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Drives the IT scenario suite in `integration_test/` on a real device, which
  # is the only place persistence, restart and the Android back button behave
  # like they do for a user. `flutter_test` alone cannot make those claims: it
  # renders into a fake binding with no app-private directory and no process to
  # restart.
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  # Direct because test/app/command_query_separation_test.dart parses lib/ into a
  # real AST. It was reachable transitively through build_runner; depending on it
  # by accident means a build_runner upgrade could remove it, so it is declared.
  # Version tracked to what `flutter analyze` itself resolves — a parser ahead of
  # the SDK's would reject syntax the SDK accepts.
  analyzer: ^12.1.0
  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  mocktail: ^1.0.5
  drift_dev: ^2.34.0
  # Same reason as `riverpod_annotation` above: it emits the code the app is
  # compiled from, so a major bump here rewrites every provider in the tree.
  riverpod_generator: ^4.0.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Runs gen-l10n on `flutter pub get` (config in l10n.yaml).
  generate: true

  # Bundled rather than pulled at runtime: a study app must render the same
  # offline, and `google_fonts` would add a dependency plus a first-run network
  # fetch for something that never changes. Both faces are OFL — the licences
  # sit next to them in assets/fonts/.
  #
  # Variable fonts. Google Fonts no longer ships static instances for either
  # family, so weight is selected along the `wght` axis; app_typography.dart
  # sets it through `fontVariations` so it works the same on every renderer.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
    # CJK fallback behind both Latin faces (see AppTypography.cjkFallbackFamily),
    # so Korean/CJK card content renders on every platform, web included.
    - family: NotoSansKR
      fonts:
        - asset: assets/fonts/NotoSansKR-Variable.ttf

  # The starter-deck templates (AD-07). Declared as a directory, so adding a
  # template is one JSON file plus one line in `manifest.json` — the manifest is
  # what the loader reads, because `AssetManifest` gives no ordering and a
  # directory listing would make "which templates ship" a filesystem accident.
  #
  # These are DEVELOPMENT AND TEST FIXTURES, not production study content
  # (BR-87); `manifest.json` says so in the bundle itself, where anyone
  # inspecting the app can read it.
  assets:
    - assets/templates/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
