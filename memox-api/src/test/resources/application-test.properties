spring.datasource.hikari.pool-name=memox-test-pool
spring.flyway.locations=classpath:db/migration

# Which database the suite runs against.
#   testcontainers (default) - a throwaway container; needs Docker. What CI uses.
#   local                    - an already-running PostgreSQL; for machines without Docker.
# See memox-api/README.md for the one-time local setup.
memox.test.database=${MEMOX_TEST_DATABASE:testcontainers}

# Read ONLY by the local backend. On the testcontainers backend the container contributes a
# JdbcConnectionDetails bean via @ServiceConnection, and Spring Boot's own
# PropertiesJdbcConnectionDetails is @ConditionalOnMissingBean(JdbcConnectionDetails.class) —
# so these three lose to the container rather than competing with it. A container that fails to
# start throws instead of falling through to localhost.
spring.datasource.url=${MEMOX_TEST_DB_URL:jdbc:postgresql://localhost:5432/memox_test}
spring.datasource.username=${MEMOX_TEST_DB_USERNAME:giapnt}
spring.datasource.password=${MEMOX_TEST_DB_PASSWORD:}

# The local backend cleans before migrating so every run starts from an empty schema, exactly as
# a fresh container does. Without this the two backends differ in the one way that matters:
# a long-lived local database accumulates state the container never has.
spring.flyway.clean-disabled=false
