spring.application.name=memox-api
spring.config.import=optional:file:.env.properties[.properties]
spring.flyway.locations=classpath:db/migration
spring.mvc.problemdetails.enabled=true
mybatis.mapper-locations=classpath*:mybatis/**/*_mapper.xml
mybatis.configuration.map-underscore-to-camel-case=true
memox.pagination.default-limit=50
memox.pagination.default-offset=0
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
logging.pattern.level=%5p [requestId:%X{requestId:-none}]
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
